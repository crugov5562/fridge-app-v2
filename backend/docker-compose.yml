version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: fridge-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: fridgeai
      POSTGRES_USER: fridgeai
      POSTGRES_PASSWORD: fridgeai_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fridgeai -d fridgeai"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: fridge-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
